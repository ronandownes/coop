media:
  - name: images
    label: Images
    input: assets/uploads
    output: /assets/uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe

components:
  document_fields:
    type: object
    label: Document fields
    fields: &docfields
      - { name: layout, type: string, hidden: true }
      - { name: handle, type: string, label: "Menu handle" }
      - { name: title, type: string, label: "Page title" }
      - { name: nav_order, type: number, label: "Menu order" }
      - { name: intro, type: text, label: Introduction }
      - name: image
        type: image
        label: "Page image"
        description: "Optional image shown below the introduction."
        options:
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe
      - { name: image_alt, type: string, label: "Image description" }
      - name: body
        type: rich-text
        label: "Answers (handle | question)"
        options:
          format: markdown
          switcher: false
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe

content:
  - name: home
    label: "Home"
    type: file
    path: index.md
    format: yaml-frontmatter
    fields:
      - { name: layout, type: string, hidden: true }
      - { name: handle, type: string, label: "Menu handle" }
      - { name: title, type: string, label: "Page title" }
      - { name: nav_order, type: number, label: "Menu order" }
      - { name: intro, type: text, label: Introduction }
      - name: image
        type: image
        label: "Page image"
        description: "Optional image shown below the introduction."
        options:
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe
      - { name: image_alt, type: string, label: "Image description" }
      - name: body
        type: code
        label: "Homepage layout/content"
        description: "The homepage uses custom visual HTML. Edit the wording carefully and keep the class names intact."
        options:
          format: html

  - { name: about, label: "About You", type: file, path: about-you.md, format: yaml-frontmatter, fields: *docfields }
  - { name: company, label: "Company & Role", type: file, path: company-role.md, format: yaml-frontmatter, fields: *docfields }
  - { name: teamwork, label: "Teamwork & Communication", type: file, path: teamwork.md, format: yaml-frontmatter, fields: *docfields }
  - { name: problem_solving, label: "Problem Solving & Initiative", type: file, path: problem-solving.md, format: yaml-frontmatter, fields: *docfields }
  - { name: financial_maths, label: "Financial Mathematics", type: file, path: financial-maths.md, format: yaml-frontmatter, fields: *docfields }
  - { name: work_readiness, label: "Work Readiness", type: file, path: work-readiness.md, format: yaml-frontmatter, fields: *docfields }
  - { name: questions, label: "Questions for Them", type: file, path: questions-for-them.md, format: yaml-frontmatter, fields: *docfields }
  - { name: wordwall, label: "Word Wall", type: file, path: word-wall.md, format: yaml-frontmatter, fields: *docfields }

  - { name: misc, label: "Miscellaneous", type: file, path: miscellaneous.md, format: yaml-frontmatter, fields: *docfields }
  - { name: spare1, label: "Abela Ethos and Values", type: file, path: spare-1.md, format: yaml-frontmatter, fields: *docfields }
  - { name: spare2, label: "dummy page", type: file, path: spare-2.md, format: yaml-frontmatter, fields: *docfields }
  - { name: spare3, label: "AI and Work", type: file, path: spare-3.md, format: yaml-frontmatter, fields: *docfields }
