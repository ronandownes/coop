media:
  - name: images
    label: Images
    input: assets/uploads
    output: /assets/uploads
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe

components:
  document_fields:
    type: object
    label: Document fields
    fields: &docfields
      - { name: layout, type: string, hidden: true }
      - { name: handle, type: string, label: "Menu handle" }
      - { name: title, type: string, label: "Page title" }
      - { name: nav_order, type: number, label: "Menu order" }
      - { name: eyebrow, type: string, label: "Eyebrow", required: false }
      - name: image
        type: image
        label: "Page image"
        description: "Optional image shown below the page header."
        options:
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe
      - { name: image_alt, type: string, label: "Image description" }
      - name: body
        type: rich-text
        label: "Answers (handle | question)"
        options:
          format: markdown
          switcher: false
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe

  about_subpage_fields:
    type: object
    label: About Me subpage fields
    fields: &aboutsubfields
      - { name: layout, type: string, hidden: true }
      - { name: handle, type: string, label: "Page handle" }
      - { name: title, type: string, label: "Page title" }
      - { name: eyebrow, type: string, label: "Eyebrow", required: false }
      - name: body
        type: rich-text
        label: "Page content"
        options:
          format: markdown
          switcher: false
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe

  skills_profile_fields:
    type: object
    label: Skills Profile fields
    fields: &skillsprofilefields
      - { name: layout, type: string, hidden: true }
      - { name: handle, type: string, label: "Page handle" }
      - { name: title, type: string, label: "Page title" }
      - { name: eyebrow, type: string, label: "Eyebrow", required: false }
      - name: body
        type: code
        label: "Page content (Markdown)"
        description: "Edit the Markdown directly. This avoids the rich-text block reordering controls."
        options:
          format: markdown

  career_fields:
    type: object
    label: Career page fields
    fields: &careerfields
      - { name: layout, type: string, hidden: true }
      - { name: handle, type: string, label: "Page handle" }
      - { name: title, type: string, label: "Page title" }
      - { name: eyebrow, type: string, label: "Eyebrow", required: false }
      - name: body
        type: rich-text
        label: "Questions and answers (handle | question)"
        options:
          format: markdown
          switcher: false
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe

  aviation_fields:
    type: object
    label: Aviation subpage fields
    fields: &aviationfields
      - { name: layout, type: string, hidden: true }
      - { name: handle, type: string, label: "Page handle" }
      - { name: title, type: string, label: "Page title" }
      - { name: eyebrow, type: string, label: "Eyebrow", required: false }
      - { name: study_mode, type: boolean, hidden: true, required: false }
      - name: body
        type: rich-text
        label: "Sections (handle | question)"
        options:
          format: markdown
          switcher: false
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe

