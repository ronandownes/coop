  - name: modules
    label: "Coursework Modules"
    type: collection
    path: modules
    format: yaml-frontmatter
    subfolders: false
    filename: "{code}-{title}.md"
    fields:
      - { name: layout, type: string, hidden: true }
      - { name: title, type: string, label: "Page title" }
      - { name: code, type: string, label: "Module code" }
      - { name: year, type: string, label: "Year" }
      - { name: semester, type: string, label: "Semester" }
      - { name: status, type: string, label: "Status", required: false }
      - { name: eyebrow, type: string, label: "Eyebrow", required: false }
      - name: body
        type: rich-text
        label: "Module notes"
        description: "Paste lecturer material here, then reduce it to upper-level concepts, explanations, applications and interview questions."
        options:
          format: markdown
          switcher: false
          media: images
          categories: [image]
          extensions: [jpg, jpeg, png, webp, gif]
          rename: safe
    operations:
      rename: false
    view:
      primary: title
      fields: [code, year, semester, status]
      sort: [title, code, year, semester]
      search: [title, code, year, semester, status]
      default:
        sort: title
        order: asc
  - { name: portfolio, label: "Portfolio", type: file, path: portfolio.md, format: yaml-frontmatter, fields: *docfields }
  - { name: turboprop_dashboard_build, label: "Portfolio · How I Built the Turboprop Dashboard", type: file, path: turboprop-dashboard-build.md, format: yaml-frontmatter, fields: *docfields }
  - { name: atr_fleet_dashboard, label: "Portfolio · ATR Fleet & Maintenance Dashboard", type: file, path: atr-fleet-dashboard.md, format: yaml-frontmatter, fields: *docfields }
  - { name: lease_dashboard_build, label: "Portfolio · How I Built the Lease Calculator", type: file, path: lease-dashboard-build.md, format: yaml-frontmatter, fields: *docfields }
  - { name: glossary, label: "Glossary (A–Z)", type: file, path: glossary.md, format: yaml-frontmatter, fields: *docfields }
